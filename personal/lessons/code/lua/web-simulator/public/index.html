<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pioneer Lua Web Simulator</title>
    <link rel="icon" href="data:,">
    <script>
        (function () {
            var storageKey = 'geoskan_app_theme_v1';
            var savedTheme = null;
            try {
                savedTheme = window.localStorage.getItem(storageKey);
            } catch (error) {
                savedTheme = null;
            }

            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (prefersDark ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js and modules loaded via Vite -->
    <!-- Fengari for Lua in browser -->
    <script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
</head>
