    <!-- Gamepad Wizard: the whole window is the scene (transmitter and drone), the card and the bottom bar float over it -->
    <div id="gp-wizard-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-content gp-wizard-modal" role="dialog" aria-modal="true" aria-labelledby="gp-wizard-title">
            <div id="gp-wizard-radio" class="gp-radio" aria-hidden="true" data-connected="false" data-phase="waiting" data-target="stick"></div>

            <section class="gp-wizard-card">
                <header class="gp-wizard-card__head">
                    <svg class="gp-wizard-card__icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z"/><path d="M9 9h.01M15 9h.01M9 15h6"/></svg>
                    <span id="gp-wizard-title" class="gp-wizard-card__title">Настройка пульта</span>
                </header>
                <button id="gp-wizard-close" type="button" class="gp-wizard-card__cancel" aria-label="Закрыть мастер">Отмена</button>
                <div class="gp-wizard-body">
                    <div id="gp-wizard-step-container">
                        <div class="gp-wizard-step">
                            <div class="gp-wizard-ask" aria-live="polite">
                                <div id="gp-wizard-instruction" class="gp-wizard-instruction">Подвигайте стик газа вверх и вниз</div>
                                <p id="gp-wizard-hint" class="gp-wizard-hint">Повторите движение, которое показывает пульт.</p>
                            </div>
                            <ul id="gp-wizard-channels" class="gp-wizard-channels" aria-label="Каналы пульта"></ul>
                            <div id="gp-wizard-primary-controls" class="gp-wizard-primary-controls">
                                <label id="gp-wizard-invert-wrap" class="gp-wizard-invert">
                                    <input type="checkbox" id="gp-wizard-invert">
                                    <span class="gp-wizard-invert__switch" aria-hidden="true"></span>
                                    <span class="gp-wizard-invert__text">Инвертировать канал</span>
                                </label>
                            </div>
                            <div id="gp-wizard-status" class="gp-wizard-status" role="status">Ожидание движения...</div>
                        </div>
                    </div>
                    <div id="gp-wizard-summary" class="gp-wizard-summary" style="display: none;">
                        <div class="gp-wizard-summary-lead">Мастер собрал каналы и диапазоны. Проверьте результат перед применением.</div>
                        <div id="gp-wizard-summary-content"></div>
                    </div>
                </div>
            </section>

            <div class="gp-wizard-footer">
                <button id="gp-wizard-prev" class="btn-secondary" disabled>Назад</button>
                <ol id="gp-wizard-steps" class="gp-wizard-steps" aria-label="Шаги мастера"></ol>
                <div class="gp-wizard-footer__actions">
                    <button id="gp-wizard-skip" class="btn-secondary gp-wizard-skip" hidden>Пропустить</button>
                    <button id="gp-wizard-next" class="btn-primary"><span class="gp-wizard-next__label">Далее</span></button>
                </div>
            </div>
        </div>
    </div>
