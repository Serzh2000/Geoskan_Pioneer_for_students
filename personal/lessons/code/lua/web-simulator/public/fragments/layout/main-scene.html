        <div class="mobile-scene-page">
            <section class="scene-stage" data-mobile-workspace-panel="scene">
                <div class="scene-viewport-card">
                    <div class="scene-container">
                        <div id="canvas-container"></div>
                        <div id="fpv-overlay">
                            <div class="fpv-header">
                                <div class="fpv-badge">FPV</div>
                                <div class="fpv-cam-info">
                                    <div>OV2640 [1600x1200]</div>
                                    <div>FPS: 24</div>
                                </div>
                            </div>
                        </div>

                        <div class="scene-hud-readout">
                            <span class="scene-viewport-fps" id="scene-fps">FPS: --</span>
                        </div>

                        <div class="scene-onboarding" id="scene-onboarding" hidden>
                            <button type="button" class="scene-onboarding__btn" onclick="openPanel('editor-panel')">
                                Открыть редактор кода
                            </button>
                            <p class="scene-onboarding__hint">Остальные инструменты — у левого края экрана</p>
                        </div>

                        <div class="camera-controls">
                            <button onclick="setCameraMode('ground')">Земля</button>
                            <button onclick="setCameraMode('drone')">Дрон</button>
                            <button onclick="setCameraMode('fpv')">FPV</button>
                            <button onclick="setCameraMode('free')">Свободно</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
