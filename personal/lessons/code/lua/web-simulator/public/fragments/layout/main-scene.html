        <div class="mobile-scene-page">
            <section class="scene-stage" data-mobile-workspace-panel="scene">
                <div class="scene-viewport-card">
                    <div class="scene-container">
                        <div id="canvas-container"></div>

                        <div id="fpv-overlay">
                            <div class="fpv-header">
                                <div class="fpv-badge">FPV</div>
                                <div class="fpv-cam-info">
                                    <div>OV2640 [1600x1200]</div>
                                    <div>FPS: 24</div>
                                </div>
                            </div>
                        </div>

                        <div class="scene-hud-readout">
                            <span class="scene-viewport-fps" id="scene-fps">FPS: --</span>
                        </div>

                        <div class="scene-onboarding" id="scene-onboarding" hidden>
                            <button type="button" class="scene-onboarding__btn" onclick="openPanel('editor-panel')">
                                Открыть редактор кода
                            </button>
                            <p class="scene-onboarding__hint">Остальные инструменты — у левого края экрана</p>
                        </div>

                        <div class="viewport-camera-controls-row">
                            <div class="camera-controls">
                                <div class="camera-controls__indicator" aria-hidden="true"></div>
                                <button onclick="setCameraMode('ground')">Земля</button>
                                <button onclick="setCameraMode('drone')">Дрон</button>
                                <button onclick="setCameraMode('fpv')">FPV</button>
                                <button onclick="setCameraMode('free')">Свободно</button>
                            </div>
                            <div class="camera-controls camera-free-mode-controls" id="camera-free-mode-controls" hidden>
                                <div class="camera-controls__indicator" aria-hidden="true"></div>
                                <button type="button" onclick="setCameraFreeSubMode('orbit')" title="Вращение вокруг точки">Орбита</button>
                                <button type="button" onclick="setCameraFreeSubMode('fly')" title="Свободный полёт (WASD)">Полёт</button>
                            </div>
                            <button
                                type="button"
                                id="scene-hotbar-toggle-btn"
                                class="scene-hotbar-toggle-btn"
                                title="Расставить объекты"
                                aria-label="Расставить объекты"
                                aria-pressed="false">
                                Объекты
                            </button>
                        </div>

                        <div id="scene-hotbar" class="scene-hotbar">
                            <div class="scene-hotbar__categories" id="scene-hotbar-categories"></div>
                            <div class="scene-hotbar__row">
                                <div class="scene-hotbar__items" id="scene-hotbar-items"></div>
                                <button type="button" id="scene-hotbar-close-btn" class="scene-hotbar__close" title="Выйти из режима расстановки" aria-label="Выйти из режима расстановки">✕</button>
                            </div>
                            <p class="scene-hotbar__hint">Выберите предмет и кликните в сцене, чтобы поставить его. Esc — выход.</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
