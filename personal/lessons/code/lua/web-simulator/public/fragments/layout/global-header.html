        <header class="header">
            <div class="header-brand">
                <button
                    id="rail-toggle-btn"
                    type="button"
                    class="btn-secondary header-icon-btn header-rail-toggle"
                    title="Показать панели инструментов"
                    aria-label="Показать панели инструментов"
                    aria-pressed="false">
                    <span class="header-icon-btn__glyph" aria-hidden="true">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="header-icon-btn__svg header-rail-toggle__icon header-rail-toggle__icon--expand">
                            <path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z" />
                            <path d="M9 4v16" />
                            <path d="M14 10l2 2l-2 2" />
                        </svg>
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.75"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="header-icon-btn__svg header-rail-toggle__icon header-rail-toggle__icon--collapse">
                            <path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z" />
                            <path d="M9 4v16" />
                            <path d="M15 10l-2 2l2 2" />
                        </svg>
                    </span>
                </button>
                <div class="header-brand-mark">G</div>
                <div class="header-brand-copy">
                    <div class="header-logo">
                        <span class="header-logo-geoscan">Geoscan</span>
                        <span class="header-logo-simulator">Симулятор</span>
                    </div>
                    <div class="header-meta">Инженерная полетная среда</div>
                </div>
            </div>
            <div class="header-actions">
                <div class="header-controls-group header-controls-group--actions">
                    <button id="run-btn" class="btn-primary">ЗАПУСТИТЬ</button>
                    <button id="stop-btn" class="btn-secondary header-danger-btn">СТОП</button>
                    <button id="restart-btn" class="btn-secondary">СБРОС</button>
                    <button
                        id="theme-toggle"
                        type="button"
                        class="btn-secondary header-icon-btn header-theme-toggle"
                        title="Переключить тему"
                        aria-label="Переключить тему"
                        aria-pressed="false">
                        <span class="header-icon-btn__glyph" aria-hidden="true">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="header-icon-btn__svg header-theme-toggle__icon header-theme-toggle__icon--light">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                                <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
                            </svg>
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="header-icon-btn__svg header-theme-toggle__icon header-theme-toggle__icon--dark">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
                            </svg>
                        </span>
                    </button>
                    <button
                        id="header-info-btn"
                        type="button"
                        class="btn-secondary header-icon-btn"
                        title="О симуляторе"
                        aria-label="О симуляторе">
                        <span class="header-icon-btn__glyph" aria-hidden="true">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="header-icon-btn__svg">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 1.006 -.5" />
                                <path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
                                <path d="M3 6v13" />
                                <path d="M12 6v13" />
                                <path d="M21 6v6" />
                                <path d="M17.001 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                                <path d="M19.001 15.5v1.5" />
                                <path d="M19.001 21v1.5" />
                                <path d="M22.032 17.25l-1.299 .75" />
                                <path d="M17.27 20l-1.3 .75" />
                                <path d="M15.97 17.25l1.3 .75" />
                                <path d="M20.733 20l1.3 .75" />
                            </svg>
                        </span>
                    </button>
                    <div class="workspace-switch" role="tablist" aria-label="Рабочая область">
                        <button
                            type="button"
                            class="workspace-switch__btn"
                            data-workspace-target="code"
                            role="tab"
                            aria-selected="false">
                            Код
                        </button>
                        <button
                            type="button"
                            class="workspace-switch__btn is-active"
                            data-workspace-target="scene"
                            role="tab"
                            aria-selected="true">
                            Сцена
                        </button>
                    </div>
                </div>
            </div>
        </header>
