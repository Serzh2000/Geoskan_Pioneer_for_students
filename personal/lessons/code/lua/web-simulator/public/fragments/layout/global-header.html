        <header class="header">
            <div class="header-brand">
                <div class="header-brand-mark">G</div>
                <div class="header-brand-copy">
                    <div class="header-logo">
                        <span class="header-logo-geoscan">Geoscan</span>
                        <span class="header-logo-simulator">Симулятор</span>
                    </div>
                    <div class="header-meta">Инженерная полетная среда</div>
                </div>
            </div>
            <div class="header-actions">
                <div class="header-controls-group">
                    <select id="file-selector" class="btn-secondary header-select">
                        <option value="">Выберите пример...</option>
                    </select>
                    <button onclick="document.getElementById('file-input').click()" class="btn-secondary" title="Открыть файл">ОТКРЫТЬ ФАЙЛ</button>
                    <input type="file" id="file-input" style="display:none" accept=".lua,.py">
                    <select id="script-language-select" class="btn-secondary header-select header-lang-select">
                        <option value="lua">Lua</option>
                        <option value="python">Python</option>
                    </select>
                    <button id="theme-toggle" type="button" class="btn-secondary header-theme-toggle" title="Переключить тему" aria-label="Переключить тему" aria-pressed="false">
                        <span class="header-theme-toggle__track" aria-hidden="true">
                            <span class="header-theme-toggle__thumb"></span>
                        </span>
                        <span class="header-theme-toggle__label">Светлая тема</span>
                    </button>
                    <label class="header-check">
                        <input type="checkbox" id="blockly-editor-toggle">
                        <span>Режим Blockly</span>
                    </label>
                    <button
                        id="header-info-btn"
                        type="button"
                        class="btn-secondary header-icon-btn"
                        title="О симуляторе"
                        aria-label="О симуляторе">
                        <span class="header-icon-btn__glyph" aria-hidden="true">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="header-icon-btn__svg">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 1.006 -.5" />
                                <path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
                                <path d="M3 6v13" />
                                <path d="M12 6v13" />
                                <path d="M21 6v6" />
                                <path d="M17.001 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                                <path d="M19.001 15.5v1.5" />
                                <path d="M19.001 21v1.5" />
                                <path d="M22.032 17.25l-1.299 .75" />
                                <path d="M17.27 20l-1.3 .75" />
                                <path d="M15.97 17.25l1.3 .75" />
                                <path d="M20.733 20l1.3 .75" />
                            </svg>
                        </span>
                    </button>
                </div>
                <div class="header-controls-group header-controls-group--actions">
                    <button id="run-btn" class="btn-primary">ЗАПУСТИТЬ</button>
                    <button id="stop-btn" class="btn-secondary header-danger-btn">СТОП</button>
                    <button id="restart-btn" class="btn-secondary">СБРОС</button>
                </div>
            </div>
        </header>
