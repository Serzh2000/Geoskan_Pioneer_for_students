            <div id="editor-panel" class="sidebar-panel active">
                <div class="panel-header panel-header--editor">
                    <div class="panel-header__lead editor-toolbar">
                        <select id="script-language-select" class="btn-secondary editor-toolbar__select editor-toolbar__select--lang" title="Язык скрипта" aria-label="Язык скрипта">
                            <option value="lua">Lua</option>
                            <option value="python">Python</option>
                            <option value="blockly">Blockly</option>
                        </select>
                        <select id="file-selector" class="btn-secondary editor-toolbar__select" aria-label="Пример программы" aria-describedby="editor-examples-status">
                            <option value="">Выберите пример...</option>
                        </select>
                        <button
                            type="button"
                            class="btn-secondary editor-toolbar__btn"
                            onclick="document.getElementById('file-input').click()"
                            title="Открыть файл с компьютера"
                            aria-label="Открыть файл с компьютера">
                            <svg class="editor-toolbar__icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19l2.757 -7.351a1 1 0 0 1 .936 -.649h12.307a1 1 0 0 1 .986 1.164l-.996 5.211a2 2 0 0 1 -1.964 1.625h-14.026a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2h4l3 3h7a2 2 0 0 1 2 2v2"/></svg><span class="editor-toolbar__label">Открыть файл</span>
                        </button>
                        <input type="file" id="file-input" style="display:none" accept=".lua,.py">
                        <button
                            type="button"
                            id="download-code-btn"
                            class="btn-secondary editor-toolbar__btn"
                            title="Скачать текущий код в файл"
                            aria-label="Скачать текущий код в файл">
                            <svg class="editor-toolbar__icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><path d="M7 11l5 5l5 -5"/><path d="M12 4l0 12"/></svg><span class="editor-toolbar__label">Скачать код</span>
                        </button>
                        <button
                            type="button"
                            id="drone-upload-btn"
                            class="btn-secondary editor-toolbar__btn"
                            title="Загрузить программу на настоящий дрон по USB (Chrome или Edge)"
                            aria-label="Загрузить программу на дрон по USB">
                            <svg class="editor-toolbar__icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 8l5 -5l5 5"/><path d="M5 21h14"/></svg><span class="editor-toolbar__label">На дрон</span>
                        </button>
                    </div>
                    <div class="editor-header-actions">
                        <span id="run-state-chip" class="pk-chip" role="status" aria-live="polite" aria-atomic="true">На земле</span>
                        <button
                            type="button"
                            id="editor-docs-toggle-btn"
                            class="editor-header-actions__btn"
                            title="Справочник API"
                            aria-label="Открыть справочник API"
                            aria-pressed="false">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-book" aria-hidden="true">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                                <path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0"></path>
                                <path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0"></path>
                                <path d="M3 6l0 13"></path>
                                <path d="M12 6l0 13"></path>
                                <path d="M21 6l0 13"></path>
                            </svg>
                        </button>
                        <button
                            type="button"
                            id="editor-terminal-toggle-btn"
                            class="editor-header-actions__btn"
                            title="Терминал (Ctrl+`)"
                            aria-label="Открыть нижнюю панель" aria-keyshortcuts="Control+`"
                            aria-pressed="false">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-terminal-2" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 9l3 3l-3 3"/><path d="M13 15l3 0"/><path d="M3 6a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -12"/></svg>
                        </button>
                        <button
                            type="button"
                            id="editor-notifications-toggle-btn"
                            class="editor-header-actions__btn"
                            title="Уведомления"
                            aria-label="Открыть уведомления"
                            aria-pressed="false">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-bell" aria-hidden="true">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                                <path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6"></path>
                                <path d="M9 17v1a3 3 0 0 0 6 0v-1"></path>
                            </svg>
                            <span id="editor-notifications-badge" class="editor-header-actions__badge" hidden>0</span>
                        </button>
                        <span class="editor-header-actions__divider" aria-hidden="true"></span>
                        <button type="button" class="panel-close-btn" onclick="closePanel()" aria-label="Закрыть редактор"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
                    </div>
                </div>
                <p id="editor-examples-status" class="editor-examples-status" role="status" aria-live="polite"></p>
                <p id="drone-upload-status" class="editor-drone-status" role="status" aria-live="polite"></p>

                <div class="panel-content panel-content--editor">
                    <div class="editor-workspace">
                    <div id="editor" class="editor-panel-host"></div>

                    <aside id="editor-docs" class="editor-docs" hidden aria-label="Справочник API">
                        <div class="editor-notifications__header">
                            <span class="editor-notifications__title">Справочник API</span>
                            <button type="button" id="editor-docs-close-btn" class="panel-close-btn" aria-label="Закрыть справочник API"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
                        </div>
                        <!-- #api-docs is moved in here from docs-panel at init (see panels/editor-docs.ts). -->
                        <div id="editor-docs-body" class="editor-docs__body"></div>
                    </aside>

                    <aside id="editor-notifications-center" class="editor-notifications" hidden aria-label="Центр уведомлений">
                        <div class="editor-notifications__header">
                            <span class="editor-notifications__title">Уведомления</span>
                            <button type="button" id="editor-notifications-clear-btn" class="editor-notifications__clear">Очистить</button>
                            <button type="button" id="editor-notifications-close-btn" class="panel-close-btn" aria-label="Закрыть уведомления"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
                        </div>
                        <div id="editor-notifications-list" class="editor-notifications__list">
                            <div class="editor-notifications__empty"><svg class="editor-empty__icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/></svg><strong>Пока всё спокойно</strong><span>Здесь появятся подсказки и сообщения об ошибках, когда вы запустите программу.</span></div>
                        </div>
                    </aside>
                    </div>
                    <!-- @include ./editor-terminal.html -->
                </div>
            </div>
