<div id="channel-monitor-panel" role="tabpanel" aria-labelledby="gp-tab-monitor" class="gamepad-panel-pane gamepad-panel-pane--channel-monitor" data-gamepad-pane-panel="monitor">
    <div class="gp-monitor">
        <section class="pk-section" aria-label="Управление монитором">
            <div class="pk-btn-row">
                <button id="cm-btn-freeze" class="btn-secondary" type="button">Заморозить график</button>
                <button id="cm-btn-reset-peaks" class="btn-secondary" type="button">Сбросить пики</button>
            </div>
            <label class="pk-toggle">
                <span class="pk-toggle__text"><span class="pk-toggle__title">Показывать min/max</span></span>
                <input type="checkbox" id="cm-toggle-peaks" role="switch" checked>
                <span class="pk-switch" aria-hidden="true"></span>
            </label>
            <p class="pk-section__hint">Первые 16 входов активного пульта в реальном времени.</p>
        </section>

        <section class="pk-section" aria-labelledby="channel-monitor-title">
            <div class="pk-section__head">
                <h3 id="channel-monitor-title" class="pk-section__title">Каналы CH1–CH16</h3>
                <span id="channel-monitor-board-status" class="pk-section__meta" role="status">Нет данных от пульта</span>
            </div>
            <div id="channel-monitor-grid" class="channel-monitor-grid"></div>
        </section>
    </div>
</div>
