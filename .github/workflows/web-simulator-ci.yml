name: web-simulator CI

on:
  push:
    branches: [main]
    paths:
      - 'simulator/**'
      - 'examples/**'
      - 'book/tex/**'
      - '.github/workflows/web-simulator-ci.yml'
  pull_request:
    paths:
      - 'simulator/**'
      - 'examples/**'
      - 'book/tex/**'
      - '.github/workflows/web-simulator-ci.yml'

defaults:
  run:
    working-directory: simulator

jobs:
  check:
    name: type-check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
